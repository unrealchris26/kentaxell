# Static site at the repo root, one function for lead intake.
#
# The domain is registered at GoDaddy; only DNS points here. See README
# "Deploying" for the records. Netlify issues and renews the certificate,
# and redirects www → apex automatically once the primary domain is set.

[build]
  publish    = "."
  functions  = "netlify/functions"
  command    = ""

[functions]
  node_bundler = "esbuild"

# ── headers ─────────────────────────────────────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options        = "SAMEORIGIN"
    Referrer-Policy        = "strict-origin-when-cross-origin"
    Permissions-Policy     = "geolocation=(), microphone=(), camera=(), interest-cohort=()"

# Images, video and fonts are content-addressed by name and rarely change.
[[headers]]
  for = "/assets/img/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/assets/vids/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# CSS and JS filenames carry no hash, so they must revalidate or an edit
# will not reach people who have already visited.
[[headers]]
  for = "/assets/css/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/js/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# ── Block source and config from being served ──────────────────────────────
# publish = "." serves the repo root, so without these the function source,
# netlify.toml, .env.example and the README are all publicly readable.
# No secrets leak (the token lives in env vars) but there is no reason to
# expose the server code or the API shape.
[[redirects]]
  from = "/netlify/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/netlify.toml"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/.env*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/README.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/serve.cmd"
  to = "/404.html"
  status = 404
  force = true

# The 65MB of camera originals are gitignored, so a GitHub-linked deploy
# never uploads them. This is belt-and-braces if anyone CLI-deploys.
[[redirects]]
  from = "/assets/img/opt/*"
  to = "/404.html"
  status = 404
  force = true
